name = "feedmeai-api"
main = "src/index.js"
compatibility_date = "2026-09-20"

[[d1_databases]]
binding = "DB"
database_name = "feedmeai"
database_id = "b4326a73-299b-4fc6-a87b-3ff39bab2d87"

[vars]
ARCADE_API = "https://api.victorsaly.com"
ALLOWED_ORIGINS = "https://feedmeai.victorsaly.com,http://localhost:5173,http://localhost:5174,http://localhost:4173,http://localhost:3000"

# Secrets (set once, not stored here):
#   npx wrangler secret put SEARCHAPI_KEY
#   npx wrangler secret put SPOONACULAR_KEY  (https://spoonacular.com/food-api/console — free tier, 150 points/day)
#   npx wrangler secret put OPENAI_API_KEY    (the photo → ideas → recipe calls; metered per address/account)
#   npx wrangler secret put YOUTUBE_API_KEY   (optional: cooking videos when Spoonacular has none — YouTube Data API v3)
